[package]
name = "subtext"
description = "A player for the films already on your disk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = ["protocol-asset"] }
subtext-align.workspace = true
subtext-container.workspace = true
subtext-core.workspace = true
subtext-index.workspace = true
subtext-scan.workspace = true
subtext-speech.workspace = true
percent-encoding = "2.3.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
specta = "=2.0.0-rc.25"
specta-typescript = "0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
tauri-plugin-dialog = "2.7.2"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
